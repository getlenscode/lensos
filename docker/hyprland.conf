monitor = ,preferred,auto,1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb

general {
    gaps_in = 7
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(91d8ffee) rgba(bb91ffcc) 45deg
    col.inactive_border = rgba(ffffff33)
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 1
    inactive_opacity = 0.94
    blur {
        enabled = true
        size = 7
        passes = 2
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000088)
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, easeOut, popin 85%
    animation = windowsOut, 1, 4, easeOut, popin 85%
    animation = fade, 1, 5, easeOut
    animation = workspaces, 1, 6, easeOut, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, E, exec, thunar
bind = $mod, B, exec, firefox-esr
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4

exec-once = kitty

# peakflava-hyprland-dotfiles theme (installed at ~/.config/hypr)
source = /home/voiceos/.config/hypr/hyprland.conf
