# VoiceOS Sway config — peakflava "Deep Purple & Cyan" theme.

set $mod Mod4

output * resolution 1280x800

font pango:JetBrainsMono Nerd Font 10
default_border pixel 3
default_floating_border pixel 2
gaps inner 7
gaps outer 16
floating_modifier $mod

# class                border      background  text        indicator   child_border
# Bright cyan border on the focused window reads as a glow over the dark
# background (Sway can't draw real shadows).
client.focused          #22d3ee     #164e63     #e0f7ff     #8b5cf6     #22d3ee
client.focused_inactive #3b2d5c     #3b2d5c     #d4d4d8     #3b2d5c     #3b2d5c
client.unfocused        #1e1e2e     #1e1e2e     #71717a     #1e1e2e     #1e1e2e
client.urgent           #ef4444     #ef4444     #0f0f1e     #ef4444     #ef4444
client.placeholder      #1e1e2e     #1e1e2e     #d4d4d8     #1e1e2e     #1e1e2e
client.background       #0f0f1e

bindsym $mod+Return exec /opt/noVNC/docker/kitty-launch.sh
bindsym $mod+d exec rofi -show drun
bindsym $mod+q kill
bindsym $mod+e exec thunar
bindsym $mod+b exec /opt/noVNC/docker/browser-launch.sh
bindsym $mod+Shift+c reload
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym Print exec grim "$HOME/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"

exec /opt/noVNC/docker/kitty-launch.sh
