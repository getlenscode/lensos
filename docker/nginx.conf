worker_processes 1;
pid /tmp/voiceos-nginx/nginx.pid;
error_log /dev/stderr info;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/voiceos-nginx/client_body;
    proxy_temp_path /tmp/voiceos-nginx/proxy;
    fastcgi_temp_path /tmp/voiceos-nginx/fastcgi;
    uwsgi_temp_path /tmp/voiceos-nginx/uwsgi;
    scgi_temp_path /tmp/voiceos-nginx/scgi;
    server {
        listen 6080;
        server_name _;
        root /opt/noVNC;
        index vnc.html;
        client_max_body_size 21m;

        location /websockify {
            proxy_pass http://127.0.0.1:6081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_read_timeout 130s;
        }
        # BrowserOS's built-in MCP server (Streamable HTTP), alive only while
        # BrowserOS runs. Host is spoofed to the upstream's own authority —
        # Chromium is picky about Host headers.
        location = /mcp {
            proxy_pass http://127.0.0.1:9200;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location / {
            # Always revalidate — static assets ship inside the image and
            # change with every build, so stale cache is a common failure.
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
    }
}
